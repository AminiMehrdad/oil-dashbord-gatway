services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-gateway
    env_file:
      - .env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - gateway_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  gateway_node_modules:
