services:
  mongodb:
    image: mongo:7
    container_name: oil-mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oil-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-gateway
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/oil-dashboard
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - gateway_node_modules:/app/node_modules
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

volumes:
  gateway_node_modules:
  mongodb_data:
  redis_data:
