x-backend-dev: &backend-dev
  image: myapp-nest-backend-dev:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: deps
  env_file:
    - .env
  environment:
    NODE_ENV: development
    PORT: "5000"
    MONGO_URI: mongodb://mongo:27017/${MONGO_DATABASE:-oil-dashboard}
    MONGODB_URI: mongodb://mongo:27017/${MONGO_DATABASE:-oil-dashboard}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
  volumes:
    - .:/app
    - backend-node-modules:/app/node_modules
  command: npm run start:dev
  ports:
    - "5000:5000"
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - edge-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(5000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(3000);s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  backend1:
    <<: *backend-dev

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis123}"
      ]
    volumes:
      - redis-data:/data
    networks:
      - edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  edge-net:
    external: true

volumes:
  backend-node-modules:
  mongo-data:
  redis-data:
